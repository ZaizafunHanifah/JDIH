<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JDIH Kabupaten Banyumas - Pencarian Produk Hukum</title>
    <style>
        :root {
            --primary: #E53935;
            --primary-dark: #C62828;
            --primary-light: #EF5350;
            --primary-bg: #FDEDEC;
            --primary-border: #F5C6C4;
            --text-dark: #212121;
            --text-muted: #757575;
            --text-light: #FFFFFF;
            --bg-page: #FAFAFA;
            --bg-card: #FFFFFF;
            --border-light: #E0E0E0;
            --shadow-sm: 0 2px 6px rgba(229, 57, 53, 0.08);
            --shadow-md: 0 4px 14px rgba(229, 57, 53, 0.12);
            --shadow-lg: 0 8px 24px rgba(229, 57, 53, 0.15);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-pill: 50px;
            --transition: 0.2s ease;
            --gold: #D4A017;
            --gold-light: #F9E79F;
            --badge-jenis: #1565C0;
            --badge-jenis-bg: #E3F2FD;
            --badge-jenis-border: #BBDEFB;
            --badge-topic: #2E7D32;
            --badge-topic-bg: #E8F5E9;
            --badge-topic-border: #C8E6C9;
            --btn-download: #F57C00;
            --btn-download-hover: #EF6C00;
            --btn-download-bg: #FFF3E0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: var(--bg-page);
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; }
        input, select { font-family: inherit; }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px 40px;
            flex: 1;
        }

        .header-bar {
            background: var(--primary);
            color: var(--text-light);
            padding: 16px 0;
            box-shadow: var(--shadow-md);
        }
        .header-bar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            max-width: 1100px;
        }
        .header-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.01em;
        }

        .filter-panel {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin: 24px 0 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
        }
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
            margin-bottom: 16px;
        }
        .search-wrapper {
            position: relative;
            flex: 1;
            min-width: 280px;
            max-width: 450px;
        }
        .search-box {
            width: 100%;
            padding: 14px 18px 14px 48px;
            font-size: 1rem;
            border: 2px solid var(--primary-border);
            border-radius: var(--radius-pill);
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
            background: var(--bg-card);
            color: var(--text-dark);
        }
        .search-box::placeholder { color: var(--text-muted); }
        .search-box:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(229, 57, 53, 0.12);
        }
        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: var(--text-muted);
            pointer-events: none;
        }
        .search-box:focus + .search-icon { color: var(--primary); }

        .filter-dropdown {
            padding: 12px 16px;
            font-size: 0.9rem;
            border: 2px solid var(--primary-border);
            border-radius: var(--radius-md);
            background: var(--bg-card);
            color: var(--text-dark);
            min-width: 200px;
            cursor: pointer;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .filter-dropdown:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(229, 57, 53, 0.12);
        }
        .filter-dropdown option { color: var(--text-dark); }

        .reset-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 12px 18px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--bg-card);
            border: 2px solid var(--border-light);
            border-radius: var(--radius-pill);
            transition: all var(--transition);
            white-space: nowrap;
        }
        .reset-btn:hover {
            color: var(--primary);
            border-color: var(--primary);
            background: var(--primary-bg);
        }
        .reset-btn svg { width: 16px; height: 16px; }

        .topics-row {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 8px 4px 4px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary-border) transparent;
        }
        .topics-row::-webkit-scrollbar { height: 6px; }
        .topics-row::-webkit-scrollbar-track { background: transparent; }
        .topics-row::-webkit-scrollbar-thumb { background: var(--primary-border); border-radius: 3px; }
        .topic-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            font-size: 0.82rem;
            font-weight: 600;
            border-radius: var(--radius-pill);
            border: 2px solid var(--primary-border);
            background: var(--bg-card);
            color: var(--primary);
            transition: all var(--transition);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .topic-chip:hover:not(.active) {
            background: var(--primary-bg);
            border-color: var(--primary);
        }
        .topic-chip.active {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--text-light);
        }
        .topic-chip .count {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: var(--radius-pill);
            background: rgba(229, 57, 53, 0.12);
        }
        .topic-chip.active .count {
            background: rgba(255, 255, 255, 0.25);
        }

        .section-heading {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text-dark);
            padding-bottom: 10px;
            border-bottom: 3px solid var(--gold);
            display: inline-block;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        .results-meta {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 8px;
        }
        .results-meta strong { color: var(--primary); font-weight: 700; }

        .breadcrumb {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary);
            background: var(--primary-bg);
            border: 1px solid var(--primary-border);
            border-radius: var(--radius-pill);
            margin-bottom: 20px;
            transition: all var(--transition);
        }
        .breadcrumb:hover {
            background: var(--primary);
            color: var(--text-light);
            border-color: var(--primary);
        }
        .breadcrumb svg { width: 18px; height: 18px; }

        .year-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }
        @media (max-width: 900px) {
            .year-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 480px) {
            .year-grid { grid-template-columns: 1fr; }
        }
        .year-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 28px 20px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: var(--shadow-sm);
        }
        .year-card:hover {
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
            transform: translateY(-4px);
        }
        .year-card:focus-visible {
            outline: 3px solid var(--primary-light);
            outline-offset: 2px;
        }
        .year-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }
        .year-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.1;
            margin-bottom: 12px;
            font-variant-numeric: tabular-nums;
        }
        .year-count {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-muted);
        }
        .year-count .num {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-dark);
        }
        .year-card.loading .year-count .num,
        .year-card.loading .year-value {
            opacity: 0.5;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            background: var(--bg-card);
            box-shadow: var(--shadow-sm);
        }
        .doc-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .doc-table thead {
            background: var(--primary);
            color: var(--text-light);
        }
        .doc-table th {
            padding: 14px 16px;
            text-align: left;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            white-space: nowrap;
        }
        .doc-table th:first-child { width: 60px; }
        .doc-table th:nth-child(2) { width: 140px; }
        .doc-table th:nth-child(4) { width: 120px; text-align: center; }
        .doc-table td {
            padding: 14px 16px;
            border-top: 1px solid var(--border-light);
            vertical-align: top;
        }
        .doc-table tbody tr:hover {
            background: var(--primary-bg);
        }
        .doc-table tbody tr:last-child td { border-bottom: none; }
        .doc-number {
            font-weight: 700;
            color: var(--primary);
            font-variant-numeric: tabular-nums;
        }
        .doc-date {
            font-weight: 500;
            color: var(--text-dark);
            white-space: nowrap;
        }
        .doc-title-cell {
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.4;
            margin-bottom: 8px;
        }
        .doc-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            font-size: 0.7rem;
            font-weight: 700;
            border-radius: var(--radius-pill);
            border: 1px solid;
        }
        .badge-jenis {
            background: var(--badge-jenis-bg);
            color: var(--badge-jenis);
            border-color: var(--badge-jenis-border);
        }
        .badge-topic {
            background: var(--badge-topic-bg);
            color: var(--badge-topic);
            border-color: var(--badge-topic-border);
        }
        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-dark);
            background: var(--btn-download-bg);
            border: 2px solid var(--btn-download);
            border-radius: var(--radius-pill);
            transition: all var(--transition);
            white-space: nowrap;
        }
        .btn-download:hover {
            background: var(--btn-download);
            color: var(--text-light);
            box-shadow: 0 4px 12px rgba(245, 124, 0, 0.3);
        }
        .btn-download svg { width: 14px; height: 14px; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.4;
        }
        .empty-state p { font-size: 1rem; font-weight: 500; }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            padding-top: 16px;
        }
        .page-btn {
            min-width: 42px;
            padding: 10px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            background: var(--bg-card);
            border: 2px solid var(--border-light);
            border-radius: var(--radius-sm);
            color: var(--text-dark);
            transition: all var(--transition);
        }
        .page-btn:hover:not(:disabled) {
            background: var(--primary-bg);
            border-color: var(--primary);
            color: var(--primary);
        }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .page-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--text-light);
        }
        .page-info { font-size: 0.85rem; color: var(--text-muted); padding: 0 8px; }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
            color: var(--text-muted);
            gap: 12px;
        }
        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid var(--primary-border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .hidden { display: none !important; }

        .site-footer {
            background: #EEEEEE;
            color: var(--text-muted);
            text-align: center;
            padding: 18px 10px;
            font-size: 0.78rem;
            border-top: 1px solid var(--border-light);
            margin-top: auto;
        }
        .site-footer strong { color: var(--primary); }

        @media (max-width: 768px) {
            .header-title { font-size: 1.2rem; }
            .filter-panel { padding: 20px 16px; }
            .filter-row { flex-direction: column; align-items: stretch; }
            .search-wrapper { max-width: none; }
            .filter-dropdown { min-width: auto; width: 100%; }
            .reset-btn { width: 100%; justify-content: center; }
            .section-heading { font-size: 1.15rem; }
            .year-value { font-size: 2rem; }
            .doc-table { font-size: 0.82rem; }
            .doc-table th, .doc-table td { padding: 10px 12px; }
        }
    </style>
</head>
<body>
    <header class="header-bar">
        <div class="container">
            <div class="header-title">JDIH KABUPATEN BANYUMAS</div>
        </div>
    </header>

    <main class="container">
        <section class="filter-panel" aria-label="Panel filter pencarian">
            <div class="filter-row">
                <div class="search-wrapper">
                    <input
                        type="text"
                        id="searchInput"
                        class="search-box"
                        placeholder="Cari judul, nomor, atau isi peraturan... (misal: pajak, organisasi, honorarium, RKPD)"
                        autocomplete="off"
                        aria-label="Kata kunci pencarian"
                    >
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>

                <select id="jenisFilter" class="filter-dropdown" aria-label="Filter jenis dokumen">
                    <option value="">Semua Jenis</option>
                </select>

                <button id="resetFilters" class="reset-btn" type="button" aria-label="Reset semua filter">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    Reset Filter
                </button>
            </div>

            <div class="topics-row" id="topicChips" role="group" aria-label="Filter topik"></div>
        </section>

        <div id="stateYears" class="state-view">
            <section aria-label="Daftar Tahun">
                <h2 class="section-heading" id="yearsHeading">DAFTAR PERATURAN BUPATI</h2>
                <div class="year-grid" id="yearGrid" role="list" aria-label="Kartu tahun">
                    <div class="loading" role="status" aria-live="polite">
                        <div class="spinner" aria-hidden="true"></div>
                        Memuat daftar tahun...
                    </div>
                </div>
            </section>
        </div>

        <div id="stateTable" class="state-view hidden">
            <a href="#" id="breadcrumbBack" class="breadcrumb" aria-label="Kembali ke daftar tahun">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                </svg>
                <span id="breadcrumbText">← Kembali ke Daftar Tahun</span>
            </a>

            <div class="results-meta" id="tableMeta">
                Menampilkan <strong id="showingCount">0</strong> dari <strong id="totalCount">0</strong> dokumen
            </div>

            <div class="table-wrapper">
                <table class="doc-table" id="docTable" role="table" aria-label="Daftar dokumen">
                    <thead>
                        <tr>
                            <th scope="col">No</th>
                            <th scope="col">Tanggal Terbit</th>
                            <th scope="col">Judul Produk Hukum</th>
                            <th scope="col">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="docTableBody">
                        <tr>
                            <td colspan="4">
                                <div class="loading" role="status" aria-live="polite">
                                    <div class="spinner" aria-hidden="true"></div>
                                    Memuat dokumen...
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <nav class="pagination" id="pagination" aria-label="Navigasi halaman"></nav>
        </div>
    </main>

    <footer class="site-footer" role="contentinfo">
        Demo Internal - Fitur Tambahan <strong>JDIH Kabupaten Banyumas</strong>
    </footer>

    <script src="/static/app.js"></script>
</body>
</html>
